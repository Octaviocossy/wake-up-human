name: CI

# Pull requests and pushes to main (.agents/specs/2026-11-02-open-source-readme.md, decision 2,
# superseding decision 30 of .agents/specs/2026-11-01-macos-typing-alarm.md). The repository is
# public, so standard macOS runners are free, and a run on main gives the README's CI badge a
# status. There is deliberately no epic/** trigger: every epic child already builds and tests in
# the local review gate.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # macOS 26 deployment target needs Xcode 26 or later; macos-15 images carry Xcode 16.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        # WakeUpHuman.xcodeproj is gitignored and generated (ADR-0026).
        run: xcodegen generate

      - name: Build
        run: xcodebuild -scheme WakeUpHuman -destination 'platform=macOS' build

      - name: Test
        run: xcodebuild -scheme WakeUpHuman -destination 'platform=macOS' test
