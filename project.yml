name: WakeUpHuman
options:
  bundleIdPrefix: com.ovct
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
targets:
  WakeUpHuman:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: WakeUpHuman
    entitlements:
      path: WakeUpHuman/WakeUpHuman.entitlements
      properties:
        # Spike #13 (2026-11-01): a sandboxed build can set the system volume, so the App Sandbox stays (spec decision 31).
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ovct.wakeuphuman
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Wake Up Human
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Octavio Cossy Torquati"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Local-development default only. Published builds are versioned from the git tag by
        # .github/workflows/release.yml (slice #14).
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      testTargets:
        - WakeUpHumanTests
      gatherCoverageData: false
  WakeUpHumanTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: WakeUpHumanTests
    dependencies:
      - target: WakeUpHuman
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ovct.wakeuphuman.tests
        GENERATE_INFOPLIST_FILE: YES
